# nginx config that replicates vercel.json for local dev:
#  - cleanUrls (extensionless .html serving)
#  - /api/* proxy to the shared hosted backend
#  - /favicon.ico -> logo
#  - 301s from the legacy "FahCel *.html" spaced URLs
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Locale landing pages match Vercel's extensionless, no-trailing-slash URLs.
    location ~ ^/(nl|de)/?$ {
        try_files /$1/index.html =404;
    }

    # Keep development-only translation sources out of the static site.
    location ~ ^/(scripts|locales|\.base44|\.git)(/|$) { return 404; }

    # clean URLs: /book-a-demo -> book-a-demo.html, /hash-chain -> hash-chain.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # vercel.json rewrite: /api/* -> https://dr-fry-sequencerr.vercel.app/api/*
    location /api/ {
        proxy_pass https://dr-fry-sequencerr.vercel.app;
        proxy_set_header Host dr-fry-sequencerr.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # favicon rewrite
    location = /favicon.ico {
        rewrite ^ /assets/fahcel-logo.jpg last;
    }

    # --- 301 redirects from vercel.json (legacy spaced URLs) ---
    location = /demo { return 301 /book-a-demo; }
    location = /playbook { return 301 /cold-chain-excursion-playbook; }
    location = /FahCel%20Landing.html { return 301 /; }
    location = /FahCel%20Book%20a%20Demo.html { return 301 /book-a-demo; }
    location = /FahCel%20Guide%20Download.html { return 301 /playbook-download; }
    location = /FahCel%20Excursion%20Playbook.html { return 301 /cold-chain-excursion-playbook; }
    location = /FahCel%20Hash%20Chain%20Page.html { return 301 /hash-chain; }
}
