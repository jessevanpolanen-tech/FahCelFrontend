# Base44 dev environment for the FahCel static frontend.
# Static, build-step-free site (HTML/JS served directly, no bundler).
# nginx serves the bind-mounted source so edits appear on the next request.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
